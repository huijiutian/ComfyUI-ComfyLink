# 发布到 Comfy Registry(registry.comfy.org)—— 官方推荐的触发方式。
#
# 触发:main 分支上 `pyproject.toml` 发生变化时自动发布(版本号取自
# `[project].version`)。git tag 只作里程碑记录、**不参与触发**,发布成功之后再补打。
#
# ⚠️ 这套触发方式的一个副作用,别被吓到:
#     改 `pyproject.toml` 的**任何内容**(哪怕只改 description / Icon)都会触发这条
#     流水线。如果 version 没跟着变,Registry 会以「该版本已存在」拒绝(已发布的版本
#     不可覆盖),workflow 报红。**这不是故障,只是噪音** —— 所以改 pyproject 的非
#     版本字段时,尽量和版本 bump 放进同一个提交。
#
# ⚠️ 一次性配置(没配就永远发不出去,只做一次):
#     仓库需要一个名为 REGISTRY_ACCESS_TOKEN 的 Actions secret。
#     完整步骤 + 发版清单(版本号四处同步)见仓库根的 RELEASING.md。
#
# 官方发布方式(2026-07 核对):
#   https://docs.comfy.org/registry/publishing
#   https://github.com/Comfy-Org/publish-node-action
# 官方 action 内部就是 `pip install comfy-cli` + `comfy node publish --token …`,
# 版本号取自 pyproject.toml 的 [project].version。

name: Publish to Comfy Registry

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
  # 手动补发(例如 Registry 当时挂了、或某次 push 没触发)。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前的闸门:版本号自洽 + ci.yml 的核心校验(byte-compile / unittest / ruff)。
  # 这里刻意重复 ci.yml 的三条命令而不是用 workflow_run:workflow_run 拿到的
  # 上下文 ref 是默认分支、还会被每次普通 CI 触发,要自己反查 SHA 且容易漏判。
  # 三条命令的重复成本远低于那份复杂度。(ci.yml 未做任何改动。)
  verify:
    name: verify (version + compile/test/lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 ci.yml 一致的 3.11(tests 里用了 `str | None` 等 3.10+ 语法;
      # 3.11 同时自带 tomllib,下面读 pyproject 用得上)。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime + lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp ruff

      # Registry 读 pyproject 的版本号,插件运行时/面板读 comfylink/version.py 的
      # __version__ —— 两处漂移就会发出一个「对不上号」的版本。tests/ 里已有测试守着,
      # 这里再挡一道:让失败挡在发布之前,而不是发完(不可撤回)才发现。
      - name: Verify pyproject.toml and comfylink/version.py agree
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          pyproject_version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          src = pathlib.Path("comfylink/version.py").read_text(encoding="utf-8")
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', src, re.M)
          package_version = m.group(1) if m else "<__version__ not found>"

          print(f"pyproject.toml       : {pyproject_version}")
          print(f"comfylink/version.py : {package_version}")

          if package_version != pyproject_version:
              print(
                  "::error::Version mismatch — pyproject.toml [project].version is "
                  f"'{pyproject_version}', but comfylink/version.py __version__ is "
                  f"'{package_version}'. Refusing to publish: fix both (and while you "
                  "are at it ops/versions.json + the relay's defaultPluginLatest — see "
                  "RELEASING.md), then push again."
              )
              sys.exit(1)

          print(f"OK — publishing version {pyproject_version}")
          PY

      - name: Byte-compile sources
        run: python -m py_compile __init__.py comfylink/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Lint (ruff)
        run: ruff check .

  publish:
    name: publish to registry
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # 不打印 token,只判断空 —— 少配 secret 的话报错要说人话。
      - name: Check REGISTRY_ACCESS_TOKEN is configured
        env:
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::Repository secret REGISTRY_ACCESS_TOKEN is missing or empty. Create a key at https://registry.comfy.org/nodes (publisher 'comfylink') and add it under Settings → Secrets and variables → Actions. See RELEASING.md."
            exit 1
          fi

      # 官方 action。默认自带 checkout(取当前 ref),
      # 内部 = pip install comfy-cli + `comfy node publish --token …`。
      # 发布包的排除清单在仓库根的 .comfyignore。
      # 这一步若因「版本已存在」失败:多半是改了 pyproject 但没 bump version(见文件顶部)。
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
