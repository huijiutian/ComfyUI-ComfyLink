# 发布到 Comfy Registry(registry.comfy.org)。
#
# 触发:推 `v*` 形式的 tag(例:`git tag v0.2.1 && git push origin v0.2.1`)。
# 只推 main 不会发版 —— Registry 上的版本只由 tag 决定。
#
# ⚠️ 一次性配置(没配就永远发不出去,只做一次):
#     仓库需要一个名为 REGISTRY_ACCESS_TOKEN 的 Actions secret。
#     完整步骤 + 发版清单(版本号四处同步)见仓库根的 RELEASING.md。
#
# 官方发布方式(2026-07 核对):
#   https://docs.comfy.org/registry/publishing
#   https://github.com/Comfy-Org/publish-node-action
# 官方 action 内部就是 `pip install comfy-cli` + `comfy node publish --token …`,
# 版本号取自 pyproject.toml 的 [project].version。

name: Publish to Comfy Registry

on:
  push:
    tags:
      - "v*"
  # 手动补发(例如 Registry 当时挂了)。在 Actions 页面运行时,ref 必须选一个
  # v* tag —— 选分支会被下面的 guard 拒掉。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前的闸门:版本号自洽 + ci.yml 的核心校验(byte-compile / unittest / ruff)。
  # 这里刻意重复 ci.yml 的三条命令而不是用 workflow_run:workflow_run 拿到的
  # 上下文 ref 是默认分支而不是 tag,要自己反查 tag 的 SHA、还会被每次普通 CI
  # 触发,复杂且容易漏判。三条命令的重复成本远低于那份复杂度。
  # (ci.yml 未做任何改动。)
  verify:
    name: verify (version + compile/test/lint)
    runs-on: ubuntu-latest
    steps:
      - name: Guard — must run on a v* tag
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::This workflow publishes a tagged release, but it was started on ${{ github.ref_type }} '${{ github.ref_name }}'. Re-run it from the Actions page with a v* tag selected as the ref, or push a tag: git tag v0.2.1 && git push origin v0.2.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # 与 ci.yml 一致的 3.11(tests 里用了 `str | None` 等 3.10+ 语法;
      # 3.11 同时自带 tomllib,下面读 pyproject 用得上)。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime + lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp ruff

      # 发版最容易出的错:tag 打了 v0.2.2 但忘了 bump pyproject。
      # 那样 Registry 收到的还是旧版本号(或直接被拒),对不上号。
      - name: Verify tag matches pyproject.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - "$TAG" <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          tag_version = tag[1:] if tag.startswith("v") else tag

          pyproject_version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          src = pathlib.Path("comfylink/version.py").read_text(encoding="utf-8")
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', src, re.M)
          package_version = m.group(1) if m else "<__version__ not found>"

          print(f"git tag              : {tag}   (version part: {tag_version})")
          print(f"pyproject.toml       : {pyproject_version}")
          print(f"comfylink/version.py : {package_version}")

          errors = []
          if tag_version != pyproject_version:
              errors.append(
                  f"git tag '{tag}' means version '{tag_version}', "
                  f"but pyproject.toml [project].version is '{pyproject_version}'"
              )
          if package_version != pyproject_version:
              errors.append(
                  f"comfylink/version.py __version__ is '{package_version}', "
                  f"but pyproject.toml [project].version is '{pyproject_version}'"
              )

          if errors:
              for e in errors:
                  print(f"::error::Version mismatch — {e}")
              print(
                  "::error::Refusing to publish. Fix the version(s), commit, then move the tag: "
                  "git tag -d <tag> && git push origin :refs/tags/<tag> && git tag <tag> && git push origin <tag>"
              )
              sys.exit(1)

          print(f"OK — publishing version {pyproject_version}")
          PY

      - name: Byte-compile sources
        run: python -m py_compile __init__.py comfylink/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Lint (ruff)
        run: ruff check .

  publish:
    name: publish to registry
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # 不打印 token,只判断空 —— 少配 secret 的话报错要说人话。
      - name: Check REGISTRY_ACCESS_TOKEN is configured
        env:
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::Repository secret REGISTRY_ACCESS_TOKEN is missing or empty. Create a key at https://registry.comfy.org/nodes (publisher 'comfylink') and add it under Settings → Secrets and variables → Actions. See RELEASING.md."
            exit 1
          fi

      # 官方 action。默认自带 checkout(取当前 ref = 本次的 tag),
      # 内部 = pip install comfy-cli + `comfy node publish --token …`。
      # 发布包的排除清单在仓库根的 .comfyignore。
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
